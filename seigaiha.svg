<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="40" height="20" viewBox="0 0 40 20">
  <!-- 青海波（せいがいは）の地紋。上の段から順に重ねて描く -->
  <defs>
    <g id="w">
      <circle r="20" fill="#0e1b2f"/>
      <g fill="none" stroke="#1a3050" stroke-width="1.3">
        <circle r="18.6"/>
        <circle r="14.6"/>
        <circle r="10.6"/>
        <circle r="6.6"/>
        <circle r="2.6"/>
      </g>
    </g>
  </defs>
  <use xlink:href="#w" x="0" y="0"/><use xlink:href="#w" x="40" y="0"/>
  <use xlink:href="#w" x="-20" y="10"/><use xlink:href="#w" x="20" y="10"/><use xlink:href="#w" x="60" y="10"/>
  <use xlink:href="#w" x="0" y="20"/><use xlink:href="#w" x="40" y="20"/>
  <use xlink:href="#w" x="-20" y="30"/><use xlink:href="#w" x="20" y="30"/><use xlink:href="#w" x="60" y="30"/>
</svg>
